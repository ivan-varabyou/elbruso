version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: elbruso-qdrant
    ports:
      - "7999:6333"
      - "7998:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:7999/collections"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  qdrant_data:
